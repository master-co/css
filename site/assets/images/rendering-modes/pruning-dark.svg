<svg xmlns="http://www.w3.org/2000/svg" width="400" height="590" viewBox="0 0 400 590" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Native CSS pruning</title>
  <desc id="description">Read native class names from the root’s selected source files. Each file chooses its own preserve/prune policy. An opted-in imported file uses the importing root’s selected class usage; the root’s pruning directive does not propagate into imports. Keep surviving native rules. Under pruning, retained animation declarations and tokens retain required keyframes; same-name definitions keep their conditions, layers and order. Source usage is a conservative signal; pruning does not evaluate the live DOM.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#696969"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#898989" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="400" height="590" rx="0" fill="#111111" />
  <g transform="translate(20 20)">
      <text x="180" y="30" font-size="18" font-weight="500" fill="#e5e5e5" text-anchor="middle">Selected sources</text>
      <text x="180" y="57" font-size="16" font-weight="400" fill="#ababab" text-anchor="middle">Complete native class usage</text>
      <path d="M180 74V104" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <rect x="65" y="116" width="230" height="78" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="66" y="117" width="228" height="76" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="85" y="147" font-size="18" font-weight="500" fill="#e5e5e5" >style.css</text>
      <text x="85" y="175" font-size="16" font-weight="400" fill="#ababab" >@prune native;</text>
      <path d="M180 206V222M180 222H88V256" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M180 222H272V256" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="180" y="247" font-size="15" font-weight="400" fill="#ababab" text-anchor="middle">imports</text>
      <rect x="8" y="268" width="160" height="120" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="9" y="269" width="158" height="118" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="24" y="299" font-size="18" font-weight="500" fill="#e5e5e5" >cards.css</text>
      <text x="24" y="328" font-size="16" font-weight="400" fill="#ababab" >@prune native;</text>
      <text x="24" y="366" font-size="16" font-weight="400" fill="#e5e5e5" >Used rules kept</text>
      <rect x="192" y="268" width="160" height="120" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="193" y="269" width="158" height="118" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="208" y="299" font-size="18" font-weight="500" fill="#e5e5e5" >vendor.css</text>
      <text x="208" y="328" font-size="16" font-weight="400" fill="#ababab" >No opt-in</text>
      <text x="208" y="366" font-size="16" font-weight="400" fill="#e5e5e5" >Native rules kept</text>
      <path d="M88 402V439" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="112" y="427" font-size="16" font-weight="400" fill="#ababab" >retained animation</text>
      <rect x="8" y="451" width="344" height="75" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="9" y="452" width="342" height="73" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="28" y="481" font-size="18" font-weight="500" fill="#e5e5e5" >Required keyframes</text>
      <text x="28" y="509" font-size="16" font-weight="400" fill="#ababab" >Keep conditions, layers and order</text>
    </g>
</svg>
