<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Runtime delivery</title>
  <desc id="description">Read connected elements and receive DOM class changes. Execute complete classes with the compiled project program. Insert or reuse native CSS rules in the runtime stylesheet. The browser engine inserts or reuses CSS rules. Cached rules can outlive their connected DOM usage.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#fafafa" />
  <g transform="translate(0 0)">
      <g transform="translate(0 24)">
      <text x="62" y="92" font-size="20" font-weight="500" fill="#626262" >Connected DOM</text>
      <path d="M62 114V246Q62 264 80 264H336Q356 264 356 244V214" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M62 145H76M62 211H76" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="88" y="114" width="198" height="66" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="89" y="115" width="196" height="64" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="102" y="141" font-size="20" font-weight="500" fill="#292929" >&lt;h2&gt;</text>
      <text x="102" y="167" font-size="18" font-weight="400" fill="#626262" >(text-align:center)</text>
      <rect x="88" y="194" width="72" height="36" rx="7" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="89" y="195" width="70" height="34" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="102" y="220" font-size="20" font-weight="400" fill="#626262" >&lt;p&gt;</text>

      <rect x="326" y="136" width="60" height="64" rx="9" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="327" y="137" width="58" height="62" rx="8" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <g transform="translate(343 155)" fill="none" stroke="#8c8c8c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect width="26" height="26" rx="4"/>
        <rect x="7" y="7" width="12" height="12" rx="2"/>
        <path d="M7-5v5m12-5v5M7 26v5m12-5v5M-5 7h5m-5 12h5M26 7h5m-5 12h5"/>
      </g>
      <text x="356" y="92" font-size="20" font-weight="500" fill="#292929" text-anchor="middle">Engine + program</text>

      <text x="498" y="92" font-size="20" font-weight="500" fill="#292929" text-anchor="middle">CSS rules</text>
      <rect x="450" y="120" width="96" height="118" rx="8" fill="#f4f4f4" stroke="#dcdcdc"/>
      <rect x="444" y="114" width="108" height="118" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="445" y="115" width="106" height="116" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <rect x="462" y="138" width="70" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="462" y="162" width="52" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="462" y="186" width="70" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="462" y="210" width="52" height="4" rx="2" fill="#b6b6b6" opacity=".65"/>
      <path d="M400 168H430" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="498" y="274" font-size="18" font-weight="400" fill="#626262" text-anchor="middle">Insert / reuse</text>
      </g>
    </g>
</svg>
