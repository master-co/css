<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Progressive delivery</title>
  <desc id="description">Generate CSS from the classes in the rendered page HTML. Send the initial CSS with the HTML so the browser can apply it before runtime startup. Read the page hydration manifest and track connected DOM classes. By default, a class outside that manifest loads the browser engine and project program, adopts matching existing rules, and generates any additional CSS. Initial CSS arrives with the HTML. With a valid pre-rendered stylesheet and page manifest, the engine stays deferred until a connected class outside that manifest appears.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#696969"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#898989" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#111111" />
  <g transform="translate(0 0)">
      <text x="58" y="94" font-size="20" font-weight="500" fill="#ababab" >Build / server</text>
      <path d="M68 120H168L190 142V264Q190 274 180 274H68Q58 274 58 264V130Q58 120 68 120Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <path d="M168 121V137Q168 142 173 142H189" fill="none" stroke="#3c3c3c"/>
      <text x="72" y="158" font-size="20" font-weight="500" fill="#e5e5e5" >HTML</text>
      <rect x="72" y="181" width="88" height="4" rx="2" fill="#646464" />
      <rect x="72" y="199" width="72" height="4" rx="2" fill="#3e3e3e" />
      <path d="M59 222H189V264Q189 273 180 273H68Q59 273 59 264Z" fill="#202020"/>
      <path d="M59 222H189" stroke="#414141"/>
      <text x="72" y="256" font-size="20" font-weight="500" fill="#e5e5e5" >Inline CSS</text>
      <path d="M204 178H224" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

      <rect x="238" y="80" width="300" height="248" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="239" y="81" width="298" height="246" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <rect x="239" y="81" width="298" height="36" rx="9" fill="#2e2e2e" />
      <rect x="239" y="99" width="298" height="18" rx="0" fill="#2e2e2e" />
      <path d="M239 117H537" stroke="#414141"/>
      <circle cx="254" cy="99" r="2" fill="#747474"/><circle cx="264" cy="99" r="2" fill="#747474"/><circle cx="274" cy="99" r="2" fill="#747474"/>
      <text x="294" y="107" font-size="20" font-weight="500" fill="#e5e5e5" >Browser</text>

      <rect x="258" y="137" width="172" height="62" rx="5" fill="#252525" stroke="#414141"/>
      <rect x="272" y="150" width="90" height="6" rx="3" fill="#646464" />
      <rect x="272" y="168" width="128" height="4" rx="2" fill="#3e3e3e" />
      <rect x="272" y="182" width="44" height="8" rx="3" fill="#bcbcbc" />
      <path d="M370 211V219" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
      <text x="370" y="239" font-size="20" font-weight="500" fill="#e5e5e5" text-anchor="middle">New class</text>
      <text x="370" y="263" font-size="18" font-weight="400" fill="#ababab" text-anchor="middle">outside page manifest</text>
      <path d="M370 274V283" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arrow)"/>

      <g transform="translate(268 290)" fill="none" stroke="#747474" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect width="22" height="22" rx="3"/>
        <rect x="6" y="6" width="10" height="10" rx="1"/>
        <path d="M6-4v4m10-4v4M6 22v4m10-4v4M-4 6h4m-4 10h4M22 6h4m-4 10h4"/>
      </g>
      <text x="304" y="309" font-size="20" font-weight="500" fill="#e5e5e5" >Engine + program</text>
      <path d="M482 302H488Q500 302 500 290V176H444" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="484" y="152" font-size="18" font-weight="400" fill="#ababab" text-anchor="middle">New CSS</text>
    </g>
</svg>
