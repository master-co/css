<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">One shared source, two pruning scopes</title>
  <desc id="description">Both a.css and b.css import shared.css, which opts into native pruning and defines shared-card and only-used-in-b. Each root selects its own page.html. A uses shared-card; B uses shared-card and only-used-in-b. A retains only shared-card from the shared source. B retains both rules. The shared source file itself is unchanged. Each root filters the same shared source with its own selected usage. Only the shared source’s portion of each output is shown.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#fafafa" />
  <g transform="translate(20 20)">
      <rect x="160" y="8" width="240" height="136" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="161" y="9" width="238" height="134" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="180" y="42" font-size="20" font-weight="500" fill="#292929" >shared.css</text>
      <text x="180" y="71" font-size="18" font-weight="400" fill="#626262" >@prune native;</text>
      <text x="180" y="101" font-size="18" font-weight="400" fill="#292929" >.shared-card</text>
      <text x="180" y="127" font-size="18" font-weight="400" fill="#292929" >.only-used-in-b</text>

      <path d="M280 155V176H130V231" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M280 176H430V231" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="96" y="209" font-size="18" font-weight="400" fill="#626262" text-anchor="end">A usage</text>
      <text x="464" y="209" font-size="18" font-weight="400" fill="#626262" >B usage</text>

      <rect x="10" y="244" width="240" height="108" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="11" y="245" width="238" height="106" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="30" y="277" font-size="20" font-weight="500" fill="#292929" >A output</text>
      <text x="30" y="309" font-size="18" font-weight="400" fill="#292929" >.shared-card</text>
      <rect x="310" y="244" width="240" height="108" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="311" y="245" width="238" height="106" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="330" y="277" font-size="20" font-weight="500" fill="#292929" >B output</text>
      <text x="330" y="309" font-size="18" font-weight="400" fill="#292929" >.shared-card</text>
      <text x="330" y="335" font-size="18" font-weight="400" fill="#292929" >.only-used-in-b</text>
    </g>
</svg>
