<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">CSS hydration</title>
  <desc id="description">Load the page hydration manifest; keep using the existing stylesheet. When the browser engine starts, use the project program to replay manifest classes in server rule order, validate resources, and compare the generated rules with the existing CSSOM. Reuse matching rules as runtime-managed rule objects. A mismatch rebuilds CSS. When the engine starts, matching rules are adopted; a mismatch rebuilds CSS. A referenced manifest that cannot load or validate rejects startup before this comparison.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#fafafa" />
  <g transform="translate(0 0)">
      <text x="62" y="90" font-size="20" font-weight="500" fill="#292929" >Existing CSS</text>
      <rect x="68" y="116" width="144" height="84" rx="8" fill="#f4f4f4" stroke="#dcdcdc"/>
      <rect x="62" y="110" width="156" height="84" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="63" y="111" width="154" height="82" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <rect x="80" y="131" width="112" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="80" y="153" width="89" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="80" y="175" width="66" height="4" rx="2" fill="#b6b6b6" opacity=".65"/>

      <path d="M346 62H518L538 82V102Q538 110 530 110H346Q338 110 338 102V70Q338 62 346 62Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <path d="M518 63V77Q518 82 523 82H537" fill="none" stroke="#d5d5d5"/>
      <text x="352" y="96" font-size="20" font-weight="500" fill="#292929" >Page manifest</text>
      <path d="M438 122V136" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <g transform="translate(340 154)" fill="none" stroke="#8c8c8c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect width="22" height="22" rx="3"/>
        <rect x="6" y="6" width="10" height="10" rx="1"/>
        <path d="M6-4v4m10-4v4M6 22v4m10-4v4M-4 6h4m-4 10h4M22 6h4m-4 10h4"/>
      </g>
      <text x="376" y="173" font-size="20" font-weight="500" fill="#292929" >Engine replay</text>

      <path d="M140 212V222H196" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M438 190V222H380" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M288 174L366 222L288 270L210 222Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <text x="288" y="230" font-size="20" font-weight="500" fill="#292929" text-anchor="middle">Compare</text>

      <path d="M288 282V302" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M288 302H142V320" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M288 302H438V320" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="142" y="289" font-size="18" font-weight="400" fill="#626262" text-anchor="middle">Match</text>
      <text x="438" y="289" font-size="18" font-weight="400" fill="#626262" text-anchor="middle">Mismatch</text>
      <g transform="translate(74 346)" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle r="11"/><path d="m-5 0 3 3 7-7"/></g>
      <g transform="translate(370 346)" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9-5a11 11 0 1 0 1 9M9-12v7H2"/></g>
      <text x="96" y="354" font-size="20" font-weight="500" fill="#292929" >Adopt rules</text>
      <text x="392" y="354" font-size="20" font-weight="500" fill="#292929" >Rebuild CSS</text>
    </g>
</svg>
