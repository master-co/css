<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">CSS hydration</title>
  <desc id="description">Load the page hydration manifest; keep using the existing stylesheet. When the browser engine starts, use the project program to replay manifest classes in server rule order, validate resources, and compare the generated rules with the existing CSSOM. Reuse matching rules as runtime-managed rule objects. A mismatch rebuilds CSS. When the engine starts, matching rules are adopted; a mismatch rebuilds CSS. A referenced manifest that cannot load or validate rejects startup before this comparison.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="550" rx="0" fill="#fafafa" />
  <g transform="translate(20 20)">
      <g>
      <rect x="30" y="86" width="198" height="126" rx="8" fill="#f4f4f4" stroke="#dcdcdc"/>
      <rect x="24" y="80" width="210" height="126" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="25" y="81" width="208" height="124" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="42" y="114" font-size="18" font-weight="500" fill="#292929" >Existing CSS</text>
      <path d="M25 131H233" stroke="#dcdcdc"/>
      <rect x="42" y="149" width="160" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="42" y="167" width="140" height="4" rx="2" fill="#b6b6b6" opacity=".65"/><rect x="42" y="185" width="120" height="4" rx="2" fill="#b6b6b6" opacity=".65"/>
    </g>
      <text x="428" y="66" font-size="16" font-weight="500" fill="#626262" text-anchor="middle">Page manifest</text>
      <path d="M428 79V100" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <g>
      <path d="M315 130h5m216 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><path d="M315 144h5m216 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><path d="M315 158h5m216 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/>
      <rect x="320" y="112" width="216" height="64" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="321" y="113" width="214" height="62" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <g transform="translate(336 134)" stroke="#8c8c8c" stroke-width="1.2" fill="none" stroke-linecap="round">
        <rect x="1" y="1" width="18" height="18" rx="3"/>
        <rect x="6" y="6" width="8" height="8" rx="1"/>
        <path d="M6-2v3m8-3v3M6 19v3m8-3v3M-2 6h3m-3 8h3M19 6h3m-3 8h3"/>
      </g>
      <text x="368" y="150" font-size="18" font-weight="500" fill="#292929" >Engine replay</text>

    </g>
      <path d="M129 224V232Q129 240 137 240H280M428 188V232Q428 240 420 240H280" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M280 240V266" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M280 278L352 316L280 354L208 316Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <text x="280" y="322" font-size="18" font-weight="500" fill="#292929" text-anchor="middle">Compare</text>
      <path d="M196 316H136Q128 316 128 324V402" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M364 316H424Q432 316 432 324V402" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="160" y="302" font-size="15" font-weight="400" fill="#626262" >Match</text>
      <text x="368" y="302" font-size="15" font-weight="400" fill="#626262" >Mismatch</text>
      <g transform="translate(128 433)" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle r="12"/><path d="m-5 0 3 3 7-7"/>
      </g>
      <g transform="translate(432 433)" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9-5a11 11 0 1 0 1 9M9-12v7H2"/>
      </g>
      <text x="128" y="469" font-size="18" font-weight="500" fill="#292929" text-anchor="middle">Adopt rules</text>
      <text x="432" y="469" font-size="18" font-weight="500" fill="#292929" text-anchor="middle">Rebuild CSS</text>
    </g>
</svg>
