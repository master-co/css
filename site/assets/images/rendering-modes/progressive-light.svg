      <rect x="304" y="157" width="100" height="7" rx="3.5" fill="#b6b6b6" />
      <rect x="304" y="184" width="168" height="4" rx="2" fill="#e5e5e5" />
      <rect x="304" y="195" width="143" height="4" rx="2" fill="#e5e5e5" />
      <rect x="304" y="213" width="64" height="18" rx="4" fill="#454545" />
    </g>
      <text x="385" y="298" font-size="16" font-weight="500" fill="#292929" >New class</text>
      <text x="385" y="320" font-size="15" font-weight="400" fill="#626262" >outside page manifest</text>
      <g>
      <path d="M267 372h5m228 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><path d="M267 386h5m228 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><path d="M267 400h5m228 0h5" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/>
      <rect x="272" y="354" width="228" height="60" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="273" y="355" width="226" height="58" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <g transform="translate(288 374)" stroke="#8c8c8c" stroke-width="1.2" fill="none" stroke-linecap="round">
        <rect x="1" y="1" width="18" height="18" rx="3"/>
        <rect x="6" y="6" width="8" height="8" rx="1"/>
        <path d="M6-2v3m8-3v3M6 19v3m8-3v3M-2 6h3m-3 8h3M19 6h3m-3 8h3"/>
      </g>
      <text x="320" y="390" font-size="18" font-weight="500" fill="#292929" >Engine + program</text>

