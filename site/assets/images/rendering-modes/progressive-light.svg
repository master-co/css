<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Progressive delivery</title>
  <desc id="description">Generate CSS from the classes in the rendered page HTML. Send the initial CSS with the HTML so the browser can apply it before runtime startup. Read the page hydration manifest and track connected DOM classes. By default, a class outside that manifest loads the browser engine and project program, adopts matching existing rules, and generates any additional CSS. Initial CSS arrives with the HTML. With a valid pre-rendered stylesheet and page manifest, the engine stays deferred until a connected class outside that manifest appears.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="490" rx="0" fill="#fafafa" />
  <g transform="translate(20 20)">
      <text x="22" y="70" font-size="16" font-weight="500" fill="#626262" >Build / server</text>
      <text x="240" y="70" font-size="16" font-weight="500" fill="#626262" >Browser</text>
      <path d="M200 174H228" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M370 264V342" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <path d="M260 384H216Q208 384 208 376V233Q208 225 216 225H228" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="132" y="326" font-size="15" font-weight="400" fill="#626262" >New CSS</text>
      <g>
      <path d="M32 94H164L188 118V272Q188 282 178 282H32Q22 282 22 272V104Q22 94 32 94Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <path d="M164 95V113Q164 118 169 118H187" fill="none" stroke="#d5d5d5"/>
      <text x="40" y="139" font-size="20" font-weight="500" fill="#292929" >HTML</text>
      <g stroke="#8c8c8c" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M49 156l-7 7 7 7m20-14 7 7-7 7m-8-17-4 20"/>
      </g>
      <rect x="91" y="158" width="74" height="5" rx="2.5" fill="#e5e5e5" />
      <rect x="91" y="170" width="55" height="5" rx="2.5" fill="#e5e5e5" />
      <rect x="42" y="190" width="126" height="5" rx="2.5" fill="#e5e5e5" />
      <rect x="42" y="202" width="98" height="5" rx="2.5" fill="#e5e5e5" />
      <path d="M23 220H187V272Q187 281 178 281H32Q23 281 23 272Z" fill="#f4f4f4"/>
      <path d="M23 220H187" stroke="#dcdcdc"/>
      <g transform="translate(42 241)" fill="none" stroke="#8c8c8c" stroke-width="1.2" stroke-linejoin="round">
        <path d="M1 0h10l5 5v14H1ZM11 0v5h5M5 10h7M5 14h7"/>
      </g>
      <text x="70" y="257" font-size="18" font-weight="400" fill="#292929" >Inline CSS</text>
    </g>
      <g>
      <rect x="240" y="94" width="260" height="158" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="241" y="95" width="258" height="156" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <rect x="241" y="95" width="258" height="30" rx="9" fill="#f5f5f5" />
      <rect x="241" y="114" width="258" height="11" rx="0" fill="#f5f5f5" />
      <path d="M240 125H500" stroke="#dcdcdc"/>
      <circle cx="255" cy="110" r="2" fill="#8c8c8c"/><circle cx="265" cy="110" r="2" fill="#8c8c8c"/><circle cx="275" cy="110" r="2" fill="#8c8c8c"/>
      <rect x="303" y="105" width="145" height="10" rx="3" fill="#f4f4f4" stroke="#dcdcdc" stroke-width=".6"/>
      <rect x="257" y="142" width="30" height="92" rx="4" fill="#f4f4f4" />
