<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Native CSS pruning</title>
  <desc id="description">Read native class names from the root’s selected source files. Each file chooses its own preserve/prune policy. An opted-in imported file uses the importing root’s selected class usage; the root’s pruning directive does not propagate into imports. Keep surviving native rules. Under pruning, retained animation declarations and tokens retain required keyframes; same-name definitions keep their conditions, layers and order. Source usage is a conservative signal; pruning does not evaluate the live DOM.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#b5b5b5"/><stop offset="1" stop-color="#d5d5d5"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".035"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#fafafa" />
  <g transform="translate(20 20)">
      <text x="8" y="46" font-size="20" font-weight="500" fill="#292929" >Selected sources</text>
      <text x="8" y="82" font-size="18" font-weight="400" fill="#626262" >Native class usage</text>
      <path d="M258 65H306" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <rect x="320" y="12" width="232" height="106" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="321" y="13" width="230" height="104" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="340" y="52" font-size="20" font-weight="500" fill="#292929" >style.css</text>
      <text x="340" y="89" font-size="18" font-weight="400" fill="#626262" >@prune native;</text>

      <path d="M436 132V160H128V200" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <path d="M436 160V200" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="280" y="192" font-size="18" font-weight="400" fill="#626262" text-anchor="middle">imports</text>

      <rect x="8" y="214" width="240" height="112" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="9" y="215" width="238" height="110" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="28" y="250" font-size="20" font-weight="500" fill="#292929" >cards.css</text>
      <text x="28" y="283" font-size="18" font-weight="400" fill="#626262" >@prune native;</text>
      <text x="28" y="313" font-size="18" font-weight="400" fill="#292929" >Used rules kept</text>
      <rect x="312" y="214" width="240" height="112" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="313" y="215" width="238" height="110" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="332" y="250" font-size="20" font-weight="500" fill="#292929" >vendor.css</text>
      <text x="332" y="283" font-size="18" font-weight="400" fill="#626262" >No opt-in</text>
      <text x="332" y="313" font-size="18" font-weight="400" fill="#292929" >Native rules kept</text>
      <text x="280" y="354" font-size="18" font-weight="400" fill="#626262" text-anchor="middle">Each file chooses its own policy</text>
    </g>
</svg>
