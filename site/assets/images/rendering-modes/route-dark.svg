<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Route stylesheet ownership</title>
  <desc id="description">Read project tokens and shared vocabulary at compile time. Lower local declarations, variants and native selectors. Let the framework or bundler deliver the route’s CSS output. Definition context does not load global native rules. The framework delivers route CSS; its import does not isolate selectors.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#696969"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#898989" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="400" height="640" rx="0" fill="#111111" />
  <g transform="translate(20 20)">
      <rect x="24" y="24" width="312" height="90" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="25" y="25" width="310" height="88" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="44" y="59" font-size="18" font-weight="500" fill="#e5e5e5" >Project definitions</text>
      <text x="44" y="88" font-size="16" font-weight="400" fill="#ababab" >Tokens · mixins · custom media</text>
      <path d="M180 128V189" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <text x="202" y="164" font-size="16" font-weight="400" fill="#ababab" >context</text>
      <rect x="24" y="202" width="312" height="90" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="25" y="203" width="310" height="88" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="44" y="237" font-size="18" font-weight="500" fill="#e5e5e5" >home.css</text>
      <text x="44" y="266" font-size="16" font-weight="400" fill="#ababab" >Native selectors and declarations</text>
      <path d="M180 306V365" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="202" y="342" font-size="16" font-weight="400" fill="#ababab" >compile</text>
      <rect x="24" y="378" width="312" height="90" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="25" y="379" width="310" height="88" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="44" y="413" font-size="18" font-weight="500" fill="#e5e5e5" >Route CSS output</text>
      <text x="44" y="442" font-size="16" font-weight="400" fill="#ababab" >Rules + required resources</text>
      <path d="M180 482V541" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="202" y="518" font-size="16" font-weight="400" fill="#ababab" >CSS import</text>
      <text x="180" y="571" font-size="18" font-weight="500" fill="#e5e5e5" text-anchor="middle">Framework loads the stylesheet</text>
    </g>
</svg>
