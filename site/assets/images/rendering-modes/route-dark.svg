<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">Route stylesheet ownership</title>
  <desc id="description">Read project tokens and shared vocabulary at compile time. Lower local declarations, variants and native selectors. Let the framework or bundler deliver the route’s CSS output. Definition context does not load global native rules. The framework delivers route CSS; its import does not isolate selectors.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#696969"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#898989" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#111111" />
  <g transform="translate(20 20)">
      <rect x="8" y="10" width="260" height="96" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="9" y="11" width="258" height="94" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="28" y="47" font-size="20" font-weight="500" fill="#e5e5e5" >Project definitions</text>
      <text x="28" y="80" font-size="18" font-weight="400" fill="#ababab" >Tokens · mixins · media</text>
      <path d="M138 120V184" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <text x="158" y="158" font-size="18" font-weight="400" fill="#ababab" >context</text>

      <rect x="8" y="198" width="260" height="100" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="9" y="199" width="258" height="98" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="28" y="237" font-size="20" font-weight="500" fill="#e5e5e5" >home.css</text>
      <text x="28" y="273" font-size="18" font-weight="400" fill="#ababab" >Native CSS rules</text>
      <path d="M282 249H316" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="299" y="180" font-size="18" font-weight="400" fill="#ababab" text-anchor="middle">compile</text>

      <rect x="330" y="198" width="222" height="100" rx="10" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="331" y="199" width="220" height="98" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="350" y="237" font-size="20" font-weight="500" fill="#e5e5e5" >Route CSS</text>
      <text x="350" y="273" font-size="18" font-weight="400" fill="#ababab" >Rules + resources</text>
      <path d="M441 312V326" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="418" y="324" font-size="18" font-weight="400" fill="#ababab" text-anchor="end">CSS import</text>
      <text x="552" y="356" font-size="20" font-weight="500" fill="#e5e5e5" text-anchor="end">Framework loads CSS</text>
    </g>
</svg>
