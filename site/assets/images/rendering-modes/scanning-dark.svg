<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description" font-family="Geist, sans-serif">
  <title id="title">From source to utilities</title>
  <desc id="description">Find app sources through integration defaults or explicit source directives. Read complete candidate strings without executing application code. Use the active manifest to generate rules for recognized Master CSS classes. Native class usage also feeds pruning, even when a class is not a Master CSS utility.</desc>
  <defs>
    <linearGradient id="surface" x2=".2" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="edge" x2=".65" y2="1"><stop stop-color="#696969"/><stop offset="1" stop-color="#3c3c3c"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1l4 3-4 3" fill="none" stroke="#898989" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="0" fill="#111111" />
  <g transform="translate(0 0)">
      <path d="M44 42H230L258 70V170Q258 180 248 180H44Q34 180 34 170V52Q34 42 44 42Z" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/>
      <path d="M230 43V65Q230 70 235 70H257" fill="none" stroke="#3c3c3c"/>
      <text x="54" y="80" font-size="20" font-weight="500" fill="#e5e5e5" >Source files</text>
      <text x="54" y="120" font-size="18" font-weight="400" fill="#ababab" >&apos;bg-red-60&apos;</text>
      <text x="54" y="150" font-size="18" font-weight="400" fill="#ababab" >&apos;bg-green-60&apos;</text>
      <path d="M146 194V224" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="166" y="216" font-size="18" font-weight="400" fill="#ababab" >Extract</text>

      <text x="54" y="262" font-size="20" font-weight="500" fill="#e5e5e5" >Candidates</text>
      <text x="54" y="296" font-size="18" font-weight="400" fill="#ababab" >bg-red-60</text>
      <text x="54" y="326" font-size="18" font-weight="400" fill="#ababab" >bg-green-60</text>
      <path d="M204 299H336" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="270" y="279" font-size="18" font-weight="400" fill="#ababab" text-anchor="middle">Resolve</text>

      <rect x="352" y="60" width="212" height="98" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="353" y="61" width="210" height="96" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="370" y="99" font-size="20" font-weight="500" fill="#e5e5e5" >Project definitions</text>
      <text x="370" y="131" font-size="18" font-weight="400" fill="#ababab" >Active manifest</text>
      <path d="M458 172V228" fill="none" stroke="#898989" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

      <rect x="360" y="252" width="198" height="100" rx="8" fill="#202020" stroke="#414141"/>
      <rect x="352" y="244" width="212" height="100" rx="8" fill="url(#surface)" stroke="url(#edge)" filter="url(#shadow)"/><rect x="353" y="245" width="210" height="98" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="370" y="279" font-size="20" font-weight="500" fill="#e5e5e5" >Generated CSS</text>
      <rect x="370" y="299" width="166" height="4" rx="2" fill="#646464" />
      <rect x="370" y="317" width="128" height="4" rx="2" fill="#646464" />
    </g>
</svg>
