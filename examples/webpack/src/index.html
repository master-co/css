<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
</head>

<body class="m(0)">
  <div class="absolute w-full h-full flex justify-center items-center bg-slate-95@light bg-gray-15@dark">
    <div class="h-fit">
      <div class="flex justify-center items-center gap(30)">
        <a href="https://webpack.js.org" target="_blank">
          <img src="<%= require('/assets/webpack.svg') %>" class="w(110) h(110)" alt="Webpack logo" />
        </a>
        <a href="https://css.master.co" target="_blank">
          <img src="<%= require('/assets/master.svg') %>" class="w(172) h(172)" alt="Master logo" />
        </a>
      </div>
      <h1 class="(font-size:48px) font-sans tracking-tight fg-white@dark font-heavy">
        <span class="(background-clip:text) (-webkit-text-fill-color:transparent) (background-image:linear-gradient(120deg,#1b78bf|30%,#8ed6fb))">Webpack</span>
        <span class="fg-slate-70 mx(10) font-medium">+</span>
        <span>Master CSS</span>
      </h1>
    </div>
  </div>
</body>

</html>
