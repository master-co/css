<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <script src="./index.js"></script>
</head>

<body class="m:0">
    <div class="abs full flex justify-center items-center bg:slate-95@light bg:gray-15@dark">
        <div class="h:fit">
            <div class="flex justify-center items-center gap:30px">
                <a href="https://webpack.js.org" target="_blank">
                    <img src="<%= require('/assets/webpack.svg') %>" class="size:110px" alt="Webpack logo" />
                </a>
                <a href="https://css.master.co" target="_blank">
                    <img src="<%= require('/assets/master.svg') %>" class="size:172px" alt="Master logo" />
                </a>
            </div>
            <h1 class="font:48px font:sans tracking:tight fg:white@dark font:heavy">
                <span class="text-gradient gradient(120deg,#1b78bf|30%,#8ed6fb)">Webpack</span>
                <span class="fg:slate-70 mx:10px font:medium">+</span>
                <span>Master CSS</span>
            </h1>
        </div>
    </div>
</body>

</html>
