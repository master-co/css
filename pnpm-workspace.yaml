packages:
  - 'packages/*'
  - 'examples/*'
  - 'benchmarks/*'
  - 'shared'
  - 'internal'
  - 'site'

allowBuilds:
  '@firebase/util': set this to true or false
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  '@vscode/vsce-sign': set this to true or false
  esbuild: set this to true or false
  keytar: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
  workerd: set this to true or false

supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
    - arm
  libc:
    - glibc
    - musl

verifyDepsBeforeRun: false
