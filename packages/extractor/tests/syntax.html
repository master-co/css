<ul class="{fg:blue-40/.5;font:2rem;p:4x;w:full;text-center}>li:hover@md"></ul>
<div class="w:calc(+100%-1.25rem)"></div>
<div class="p:0.625rem|5x|1.875rem|10x m:5x|1.875rem"></div>
<div class="transition:transform|.1s|ease-out,width|.1s|ease-out bg:rgb(51|170|51|.4)"></div>
<div class="width:51px transform:scale(1.2) text-align:"></div>
<div class="transform:translateX(20px) bg:indigo-40:hover@3xs transform:translate(20px,50px) transform:rotate(45deg) filter:blur(2px)"></div>
<div class="width:2.125rem:active:not([disabled])+svg>rect cursor:no-drop[disabled]+svg"></div>
<div class="filter:drop-shadow(0|2px|2px|rgba(0,0,0,.2px))"></div>
<div class="font:var(--size) font:$size"></div>
<div class="bg:blue:hover@media(any-hover:hover)"></div>
<div class="bg:gray-1@supports(backdrop-filter:none)"></div>
<div class="font:1.5rem:hover@sm text-center:hover@sm fg:sky-60/.5:hover@sm"></div>
<div class="{p:0.625rem|5x|1.875rem|10x;text-center;fg:sky-60/.5}:hover@sm"></div>
<div class="width:2.125rem:active:not([disabled])+svg>rect cursor:no-drop[disabled]+svg"></div>
<div class="transform:translateX(20px) transform:translate(20px,50px) transform:rotate(45deg) filter:blur(2px)"></div>
<div class="transition:transform|.1s|ease-out,width|.1s|ease-out"></div>
<div class="filter:drop-shadow(0|2px|2px|rgba(0,0,0,.2px))"></div>
<div class="font:var(--size) font:$size"></div>
<div class="animation:shake|1s|infinite>li"></div>
<div class="animation:shake|1s|infinite>li:nth-child(2)"></div>
<div class="bg:red:nth(2)"></div>
<div class="bg:red:odd"></div>
<div class="bg:red:even"></div>
<div class="bg:red:first"></div>
<div class="bg:red:last"></div>
<div class="
    {w:0.313rem;h:0.313rem;rounded;bg:slate-90}::scrollbar
    bg:gray-20::scrollbar@dark
    bg:slate-86::scrollbar-thumb
    bg:slate-76::scrollbar-thumb:hover
    bg:slate-66::scrollbar-thumb:active
    bg:gray-30::scrollbar-thumb@dark
    bg:gray-40::scrollbar-thumb:hover@dark
    bg:gray-50::scrollbar-thumb:active@dark
    bg:transparent::scrollbar-corner
    rounded::scrollbar-thumb
"></div>
<div class="bg:gray-60::scrollbar-thumb:active@dark"></div>

<div class="m:0.625rem|5x"></div>
<div class="bg:blue-60"></div>
<div class="outline:3px|solid|red:hover"></div>
<div class=""></div>
<div class="text-center@sm"></div>
