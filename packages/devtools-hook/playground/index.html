<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        window.masterCSSConfig = {
            variants: [
                { token: '::both', branches: [{ selector: '&::before,&::after' }] },
            ],
            utilities: [
                {
                    name: 'btn',
                    type: -4,
                    layer: 'components',
                    rules: [
                        { selector: '&::before,&::after', declarations: { display: 'block' } },
                        { selector: '&', declarations: { 'background-color': 'oklch(0% 0 none)' } }
                    ]
                }
            ]
        }
    </script>
    <style id="master">
        @layer components {
            .btn::before,
            .btn::after {
                display: block
            }

            .btn {
                background-color: oklch(0% 0 none);
            }

            @media (min-width: 834px) {
                .btn\@sm::before,
                .btn\@sm::after {
                    display: block;
                }
            }

            @media (min-width: 834px) {
                .btn\@sm {
                    background-color: rgb(0, 0, 0);
                }
            }
        }
    </style>
    <script type="module" src="src/main.ts"></script>
</head>

<body>
    <button class="btn btn@sm">button</button>
</body>

</html>
