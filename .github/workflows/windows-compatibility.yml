name: Windows compatibility
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full compatibility or focused regression diagnosis
        type: choice
        options: [full, focused, source-watch, registration-gap]
        default: full

permissions:
  contents: read

concurrency:
  group: windows-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ inputs.mode }} validation
    if: ${{ inputs.mode != 'registration-gap' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: compat
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-compatibility
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Install Chromium headless shell
        run: bun run playwright install --only-shell chromium
      - name: Build Rust Wasm artifacts
        run: bun run build:rust:wasm
      - name: Build regression test dependencies
        id: build
        run: bun run turbo run build --filter=@master/css-cli... --filter=@master/css-mcp... --filter=@master/css-next... --concurrency=2
      - name: Repeat CLI and MCP regressions and verify Next lock recovery
        if: ${{ inputs.mode != 'source-watch' }}
        shell: bash
        run: |
          set -uo pipefail
          result=0
          for iteration in {1..10}; do
            echo "Regression iteration $iteration of 10"
            bun run --cwd packages/cli test tests/bug-hunt-stylesheet-delivery.test.ts -t 'watch republishes changed resources' || result=1
            bun run --cwd packages/mcp test tests/core.test.ts -t 'does not follow linked directories' || result=1
          done
          bun run --cwd packages/next test tests/issues/475.test.ts tests/static-state.test.ts || result=1
          exit "$result"
      - name: Diagnose new source watching on Windows
        if: ${{ inputs.mode == 'source-watch' }}
        shell: bash
        env:
          CLI_WATCH_TRACE_DIR: ${{ runner.temp }}/cli-watch-traces
        run: |
          set -uo pipefail
          result=0
          for iteration in {1..3}; do
            echo "Complete CLI suite iteration $iteration of 3"
            CLI_WATCH_TRACE_RUN="full-$iteration" bun run --cwd packages/cli test || result=1
          done
          for iteration in {1..10}; do
            echo "Source watcher iteration $iteration of 10"
            CLI_WATCH_TRACE_RUN="focused-$iteration" bun run --cwd packages/cli test tests/bug-hunt-watch-new-sources.test.ts || result=1
          done
          exit "$result"
      - name: Test every package
        if: ${{ !cancelled() && inputs.mode == 'full' && steps.build.outcome == 'success' }}
        env:
          CLI_WATCH_TRACE_DIR: ${{ runner.temp }}/cli-watch-traces
          CLI_WATCH_TRACE_RUN: workspace-${{ github.run_id }}-${{ github.run_attempt }}
        # Re-execute Turbo tasks to match the original cache-miss workload;
        # cached suites cannot provide new events or diagnostic traces.
        run: bun run turbo run test '--filter=./packages/*' --concurrency=2 --continue=dependencies-successful --force
      - name: Retain source watcher diagnostics
        if: ${{ always() && inputs.mode != 'focused' }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-source-watch-traces
          path: ${{ runner.temp }}/cli-watch-traces/
          if-no-files-found: warn
          retention-days: 7
      - name: Build every example
        if: ${{ !cancelled() && inputs.mode == 'full' && steps.build.outcome == 'success' }}
        run: bun run turbo run build '--filter=./examples/*' --concurrency=4
      - name: Retain the Turbo cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-compat-${{ github.ref_name }}-${{ github.run_id }}

  registration_gap:
    name: Observe native directory registration on Windows
    if: ${{ inputs.mode == 'registration-gap' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install the pinned watcher in isolated tools
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/watch-gap-tools" --ignore-scripts --no-audit --no-fund chokidar@5.0.0
      - name: Observe the actual Windows directory events
        shell: bash
        run: node packages/cli/tests/fixtures/watch-registration-gap-runner.mjs "$RUNNER_TEMP/watch-gap-tools/node_modules/chokidar/index.js" "$RUNNER_TEMP/watch-gap-traces"
      - name: Repeat original writes from a separate process
        shell: bash
        run: node packages/cli/tests/fixtures/watch-new-sources-stress.mjs "$RUNNER_TEMP/watch-gap-tools/node_modules/chokidar/index.js" "$RUNNER_TEMP/watch-gap-traces" 200
      - name: Retain bounded registration timelines
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-watch-registration-gap
          path: ${{ runner.temp }}/watch-gap-traces/
          if-no-files-found: error
          retention-days: 7
