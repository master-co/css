name: Check title of pull request
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs base-branch code; keep the token out of the checkout.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Only commitlint runs here, so skip husky and every package postinstall.
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache: "false"
          ignore-scripts: "true"
      - run: printf '%s\n' "$PR_TITLE" | bun run commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
