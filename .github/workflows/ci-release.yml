name: CI & Release
on:
    push:
        branches:
            - "**"
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    TRUSTED_CI: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - if: ${{ env.TRUSTED_CI != 'true' }}
              run: |
                  echo "Full CI requires the private internal submodule and is not available for untrusted pull requests."
                  exit 1
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: actions/checkout@v6
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run build
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run lint

    type-check:
        runs-on: ubuntu-latest
        steps:
            - if: ${{ env.TRUSTED_CI != 'true' }}
              run: |
                  echo "Full CI requires the private internal submodule and is not available for untrusted pull requests."
                  exit 1
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: actions/checkout@v6
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run build
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run type-check

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - if: ${{ env.TRUSTED_CI != 'true' }}
              run: |
                  echo "Full CI requires the private internal submodule and is not available for untrusted pull requests."
                  exit 1
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: actions/checkout@v6
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run build
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run test:ci

    build-examples:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - if: ${{ env.TRUSTED_CI != 'true' }}
              run: |
                  echo "Full CI requires the private internal submodule and is not available for untrusted pull requests."
                  exit 1
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: actions/checkout@v6
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm build
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm install --frozen-lockfile
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm build:examples

    e2e:
        runs-on: ubuntu-latest
        steps:
            - if: ${{ env.TRUSTED_CI != 'true' }}
              run: |
                  echo "Full CI requires the private internal submodule and is not available for untrusted pull requests."
                  exit 1
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: actions/checkout@v6
            - if: ${{ env.TRUSTED_CI == 'true' }}
              uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm exec playwright install --with-deps
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm run build
            - if: ${{ env.TRUSTED_CI == 'true' }}
              run: pnpm e2e

    release:
        needs:
            - lint
            - test
            - type-check
            - build-examples
            - e2e
        if: ${{ github.event_name == 'push' && contains(fromJSON('["main","alpha","beta","rc","canary"]'), github.ref_name) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup-pnpm
              with:
                  submodules-token: ${{ secrets.GH_TOKEN }}
            - run: pnpm install semantic-release semantic-release-config-techor @semantic-release/exec --workspace-root
            - run: pnpm run build
            - run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
