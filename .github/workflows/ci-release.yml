name: CI & Release
on:
    push:
        branches:
            - "**"
    pull_request_target:
        types:
            - opened
            - reopened
            - edited
            - synchronize

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm run build
            - run: pnpm run lint

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [24]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm run build
            - run: pnpm run test:ci

    type-check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm run build
            - run: pnpm run type-check

    example-check:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [24]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm build
            - run: pnpm install
            - run: pnpm build:examples

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm exec playwright install --with-deps
            - run: pnpm run build
            - run: pnpm e2e

    release:
        needs:
            - lint
            - test
            - type-check
            - example-check
            - e2e
        if: ${{ github.event_name == 'push' && contains(fromJSON('["main","alpha","beta","rc","canary"]'), github.ref_name) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm install semantic-release-config-techor --workspace-root
            - run: pnpm run build
            - run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
