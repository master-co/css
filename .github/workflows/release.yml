name: Release
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original Release run ID (or a previous recovery run) for this exact branch SHA
        required: true
        type: string
      source_attempt:
        description: Original run attempt containing the retained npm evidence
        required: true
        type: string
      version:
        description: Exact archived npm version to resume
        required: true
        type: string
      confirm:
        description: Type RECOVER NPM ONLY to authorize resuming this cohort without deployment
        required: true
        type: string
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - canary

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/validation.yml
    with:
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}
      full: true
      release_build: true

  release:
    if: ${{ github.event_name == 'push' }}
    needs: validation
    outputs:
      released: ${{ steps.outcome.outputs.released }}
      version: ${{ steps.outcome.outputs.version }}
      revision: ${{ steps.outcome.outputs.revision }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: build
      - name: Download Tier-1 native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mastercss-binding-*
          path: binding-artifacts
      - name: Verify and stage Tier-1 native artifacts
        run: cargo xtask assemble-native-release binding-artifacts release-artifacts/checksums.json --stage
      - run: bun run build
      - name: Finalize release checksums
        run: cargo xtask assemble-native-release binding-artifacts release-artifacts/checksums.json --require-assets --verify-staged
      - name: Install publishing npm CLI
        run: npm install --global npm@11.21.0
      - name: Verify OIDC publication and package order
        run: bun run check:release && node --test scripts/semantic-release-workspace.test.mjs
      - name: Require unused editor versions before publishing npm
        if: ${{ needs.validation.outputs.vscode_release_affected == 'true' }}
        run: node packages/vscode/scripts/verify-store-availability.mjs
      - run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_CSS_RELEASE_STAGE: "1"
          MASTER_CSS_RELEASE_PROMOTE: "1"
      - name: Bind delivery to the actual completed release
        id: outcome
        run: node scripts/release-outcome.mjs
      - name: Preserve publication inventory and recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-artifacts/promotion-state.json
            release-artifacts/packages/*.tgz
            release-artifacts/checksums.json
          if-no-files-found: warn
          retention-days: 90

  deploy-site:
    needs:
      - validation
      - release
    if: ${{ github.event_name == 'push' && needs.release.outputs.released == 'true' && (github.ref_name == 'main' || github.ref_name == 'rc') && needs.validation.outputs.site_affected == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_COMMIT_REF: ${{ github.ref_name }}
      PUBLIC_VERSION: ${{ needs.release.outputs.version }}
      PUBLIC_URL: ${{ github.ref_name == 'main' && 'https://css.master.co' || 'https://rc.css.master.co' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: build
      # Build after npm publication so metadata resolves the tag on this exact
      # source revision. A branch deploy hook could build a newer, untested head.
      - name: Build and verify the exact site revision
        run: |
          bun run build:site
          bun run --filter site test:css-contract
          bun run --filter site test:llms
          bun run --filter site test:docs-examples
          bun run playwright install --with-deps chromium firefox webkit
          node site/scripts/verify-release-site.mjs --out site/out --origin "$PUBLIC_URL" --report site/test-results/release-site.json
      - name: Retain the verified site output
        uses: actions/upload-artifact@v7
        with:
          name: site-release-${{ github.sha }}
          path: |
            site/out/
            site/test-results/release-site.json
          if-no-files-found: error
          retention-days: 30
      - name: Deploy the verified output to its configured Pages project
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Configure the scoped Pages token before release}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the Pages account before release}"
          : "${PAGES_PROJECT:?Configure the Pages project for this release channel}"
          node scripts/pages-release-target.mjs
          bun run --cwd site wrangler pages deploy out \
            --project-name "$PAGES_PROJECT" \
            --branch "$PUBLIC_COMMIT_REF" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ github.ref_name == 'main' && vars.CLOUDFLARE_PAGES_STABLE_PROJECT || vars.CLOUDFLARE_PAGES_RC_PROJECT }}

  publish-editors:
    needs:
      - validation
      - release
    if: ${{ github.event_name == 'push' && needs.release.outputs.released == 'true' && (github.ref_name == 'main' || github.ref_name == 'rc') && needs.validation.outputs.vscode_release_affected == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          ignore-scripts: "true"
          turbo-cache: "false"
      - name: Download the exact VSIX candidates verified in this release run
        uses: actions/download-artifact@v7
        with:
          name: editor-vsix
          path: candidate-vsix
      - name: Download every installed extension-host proof from this run
        uses: actions/download-artifact@v7
        with:
          pattern: editor-proof-*
          path: editor-proofs
          merge-multiple: true
      - name: Require the tested bytes, exact source revision and all sixteen host proofs
        run: node packages/vscode/scripts/verify-editor-evidence.mjs --candidate-dir candidate-vsix --proof-dir editor-proofs
      - name: Validate editor publishing configuration
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is required to publish Open VSX extension."
            exit 1
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Preserve the exact editor candidates before publication
        uses: actions/upload-artifact@v7
        with:
          name: editor-release-${{ github.sha }}
          path: |
            candidate-vsix/
            editor-proofs/
          if-no-files-found: error
          retention-days: 90
      - name: Azure login for VSCE
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish VS Code Marketplace extension
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/candidate-vsix/masterco/*.vsix)
          if [ "${#files[@]}" -ne 8 ]; then
            echo "Expected eight verified Marketplace VSIX files."
            exit 1
          fi

          bun run --filter @master/css-vscode vsce verify-pat --azure-credential masterco
          bun run --filter @master/css-vscode vsce publish \
            --azure-credential \
            --packagePath "${files[@]}"
      - name: Publish Open VSX extension
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/candidate-vsix/master/*.vsix)
          if [ "${#files[@]}" -ne 8 ]; then
            echo "Expected eight verified Open VSX VSIX files."
            exit 1
          fi

          for file in "${files[@]}"; do
            bun x ovsx@1.0.2 publish "$file"
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  npm-recovery:
    name: Recover the explicitly selected npm cohort
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && contains(fromJSON('["main","alpha","beta","rc","canary"]'), github.ref_name) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          ignore-scripts: "true"
          turbo-cache: "false"
      - name: Verify and restore the original release evidence
        id: evidence
        run: node scripts/release-recovery-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_ATTEMPT: ${{ inputs.source_attempt }}
          RECOVERY_VERSION: ${{ inputs.version }}
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
      - name: Install the OIDC-capable publishing npm CLI
        run: npm install --global npm@11.21.0
      - name: Resume verified npm uploads and promotion only
        run: node scripts/release-recover.mjs --state "$RECOVERY_STATE" --channel "$RECOVERY_CHANNEL"
        env:
          RECOVERY_STATE: ${{ steps.evidence.outputs.state }}
          RECOVERY_CHANNEL: ${{ steps.evidence.outputs.channel }}
          MASTER_CSS_RELEASE_STAGE: "1"
          MASTER_CSS_RELEASE_PROMOTE: "1"
          MASTER_CSS_RELEASE_RECOVERY: "1"
      - name: Preserve recovery evidence even after partial failure
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-artifacts/recovery/promotion-state.json
            release-artifacts/recovery/packages/*.tgz
            release-artifacts/recovery/checksums.json
          if-no-files-found: error
          retention-days: 90
