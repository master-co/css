name: Validation
on:
  workflow_call:
    inputs:
      base_sha:
        description: Git revision used as the affected comparison base.
        type: string
        default: ""
      head_sha:
        description: Git revision used as the affected comparison head.
        type: string
        default: ""
      full:
        description: Whether to run every validation task instead of affected tasks.
        type: boolean
        default: false
      release_build:
        description: Whether to build every package before validation and warm the release cache.
        type: boolean
        default: false
    outputs:
      site_affected:
        description: Whether the site build is affected by this change.
        value: ${{ jobs.quality_linux.outputs.site_affected }}
      vscode_release_affected:
        description: Whether editor inputs changed, independent of full validation selection.
        value: ${{ jobs.quality_linux.outputs.vscode_release_affected }}
      vscode_affected:
        description: Whether the VS Code extension build is affected by this change.
        value: ${{ jobs.quality_linux.outputs.vscode_affected }}

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.range.outputs.base_sha }}
      head_sha: ${{ steps.range.outputs.head_sha }}
      full: ${{ steps.range.outputs.full }}
      range_valid: ${{ steps.range.outputs.range_valid }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve affected range
        id: range
        shell: bash
        env:
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha }}
          REQUESTED_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail

          base_sha="$REQUESTED_BASE_SHA"
          head_sha="$REQUESTED_HEAD_SHA"
          full="$REQUESTED_FULL"
          range_valid=true

          if [ -z "$base_sha" ] \
            || [ -z "$head_sha" ] \
            || [[ "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null \
            || ! git merge-base "$base_sha" "$head_sha" >/dev/null 2>&1; then
            full=true
            range_valid=false
          fi

          if [ "$range_valid" = true ] && [ "$full" != true ]; then
            # `--affected` maps changed files to packages by location, so Rust
            # sources would select no package although the bindings and every
            # dependent test the artifacts built from them. Turbo's cache still
            # replays tasks that never read those artifacts.
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*|.github/actions/setup-bun/*|package.json|bun.lock|bunfig.toml|turbo.json|.npmrc|tsconfig*.json|eslint.config.*|scripts/*|shared/*|crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml)
                  full=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$base_sha...$head_sha")
          fi

          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "full=$full"
            echo "range_valid=$range_valid"
          } >> "$GITHUB_OUTPUT"

  editor_evidence:
    name: editor-release-evidence
    needs: quality_linux
    if: ${{ inputs.release_build && (github.event_name == 'workflow_dispatch' || needs.quality_linux.outputs.vscode_release_affected == 'true') }}
    uses: ./.github/workflows/editor-verification.yml
    permissions:
      contents: read

  quality_linux:
    name: quality-linux
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      site_affected: ${{ steps.consumers.outputs.site_affected }}
      vscode_affected: ${{ steps.consumers.outputs.vscode_affected }}
      vscode_release_affected: ${{ steps.delivery.outputs.vscode_release_affected }}
    env:
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: build
      - name: Validate AI context budgets
        run: bun run check:ai-context
      - name: Validate workspace toolchain and release packing
        run: |
          bun run check:toolchain
          bun run test:toolchain
          bun test scripts/validation-workflow.test.mjs scripts/editor-release-gate.test.mjs
          node --test scripts/pages-release-target.test.mjs scripts/release-outcome.test.mjs scripts/release-readiness.test.mjs scripts/semantic-release-promotion.test.mjs scripts/release-recovery-artifact.test.mjs
      - name: Verify isolated package-manager archive consumers
        shell: bash
        run: |
          bun run playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/archive-consumer-tools" --ignore-scripts --no-audit --no-fund pnpm@12.15.0
          PATH="$RUNNER_TEMP/archive-consumer-tools/node_modules/.bin:$PATH" node --test scripts/release-archive-consumers.test.mjs
      - name: Validate package contracts
        run: |
          bun run check:mdn-registry
          bun run check:boundaries
          bun run check:packages
          bun run check:api-census
          bun run check:release
      - name: Detect affected release consumers
        id: consumers
        shell: bash
        env:
          RANGE_VALID: ${{ needs.preflight.outputs.range_valid }}
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail

          site_affected=true
          vscode_affected=true

          if [ "$RANGE_VALID" = true ] && [ "$FULL_VALIDATION" != true ]; then
            site_affected=false
            vscode_affected=false

            if bun run turbo run build --filter=site --affected --dry=json \
              | jq -e 'any(.tasks[]; .taskId == "site#build")' >/dev/null; then
              site_affected=true
            fi

            if bun run turbo run build --filter=@master/css-vscode --affected --dry=json \
              | jq -e 'any(.tasks[]; .taskId == "@master/css-vscode#build")' >/dev/null; then
              vscode_affected=true
            fi

          fi

          {
            echo "site_affected=$site_affected"
            echo "vscode_affected=$vscode_affected"
          } >> "$GITHUB_OUTPUT"
      - name: Select editor delivery from actual input changes
        id: delivery
        shell: bash
        env:
          RANGE_VALID: ${{ needs.preflight.outputs.range_valid }}
        run: |
          set -euo pipefail
          vscode_release_affected=true
          if [ "$RANGE_VALID" = true ]; then
            vscode_release_affected=$(bun run turbo run build --filter=@master/css-vscode --affected --dry=json \
              | jq -r 'any(.tasks[]; .taskId == "@master/css-vscode#build")')
            # Turbo's affected package selection does not include task inputs
            # outside package roots. These can change the bundled native payload
            # or JavaScript even when the editor's own files did not change.
            changed_files=$(git diff --name-only "$TURBO_SCM_BASE...$TURBO_SCM_HEAD")
            while IFS= read -r file; do
              case "$file" in
                crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|shared/*|scripts/build-rust-mdn-completion-registry.mjs|scripts/typescript-api.mjs|scripts/typescript-declarations.mjs|scripts/toolchain-policy.mjs|scripts/isolate-tooling-typescript.mjs)
                  vscode_release_affected=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi
          echo "vscode_release_affected=$vscode_release_affected" >> "$GITHUB_OUTPUT"
      - name: Audit site translations
        run: bun run --filter site audit:i18n
      - name: Install Chromium headless shell
        run: bun run playwright install --with-deps --only-shell chromium
      - name: Build release packages
        if: ${{ inputs.release_build }}
        run: bun run build
      - name: Build Rust Wasm artifacts
        if: ${{ !inputs.release_build }}
        run: bun run build:rust:wasm
      - name: Validate packages
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          # Each Vitest suite can use half the runner's CPU. Share that budget
          # with lint, type-check and cold package builds instead of oversubscribing.
          args=(run test lint type-check '--filter=./packages/*' --concurrency=2)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      # `--affected` selects packages by their own files, so Rust, site and example
      # changes never select the browser engine. Its task inputs cover them instead,
      # and the Turbo cache skips the differential when nothing it reads changed.
      - name: Compare the browser engine with Rust
        id: differential
        run: bun run turbo run test --filter=@master/css-engine-js
      - name: Summarize browser engine differences
        if: ${{ failure() && steps.differential.outcome == 'failure' && hashFiles('packages/engine-js/.reports/differential.md') != '' }}
        run: cat packages/engine-js/.reports/differential.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify browser runtime budgets
        run: |
          bun run turbo run build --filter=@master/css-runtime... --concurrency=2
          bun run check:runtime-size
          bun run --filter @master/css-engine-js check:size
      - name: Verify the complete release artifact surface
        if: ${{ needs.preflight.outputs.full == 'true' || inputs.release_build }}
        run: |
          bun run build
          bun run check:artifacts
      - name: Build and verify site
        if: ${{ steps.consumers.outputs.site_affected == 'true' }}
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release_build }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_BUILD" != true ]; then
            bun run build
          fi
          bun run --filter site build
          bun run --filter site test:css-contract
          node --test site/scripts/verify-release-site.test.mjs
          for check in test:home test:image-loader test:public-env test:llms test:docs-examples test:mdx-imports test:syntax test:reference test:atomic-classes test:lint-cache; do
            bun run --filter site "$check"
          done
          bun run --filter site lint:full
          bun run --filter site type-check
      - name: Verify built site in Chromium, Firefox and WebKit
        if: ${{ steps.consumers.outputs.site_affected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun run playwright install --with-deps chromium firefox webkit
          site_origin=$(node -p "JSON.parse(require('fs').readFileSync('site/.generated/public-env.json', 'utf8')).PUBLIC_URL")
          node site/scripts/verify-release-site.mjs --out site/out --origin "$site_origin" --report site/test-results/release-site.json
      - name: Retain site validation evidence
        if: ${{ !cancelled() && steps.consumers.outputs.site_affected == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-validation-${{ github.sha }}
          path: |
            site/out/
            site/test-results/release-site.json
          if-no-files-found: error
          retention-days: 7
      - name: Build examples
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          args=(run build '--filter=./examples/*')
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      # Pull requests restore the cache but never write it, so one shared entry
      # per scope is refreshed by pushes instead of every run adding a new one.
      - name: Prune and save Turbo cache
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-build-${{ github.ref_name }}-${{ github.run_id }}

  rust_quality:
    name: rust-quality
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-quality
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Validate Rust workspace
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
          cargo xtask codegen --check
          cargo xtask parity

  native_tier1:
    name: native-${{ matrix.package }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: binding-darwin-arm64
            runner: macos-15
          - package: binding-darwin-x64
            runner: macos-15-intel
          - package: binding-linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package: binding-linux-x64-gnu
            runner: ubuntu-24.04
          - package: binding-win32-arm64-msvc
            runner: windows-11-arm
          - package: binding-win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
          turbo-cache: "false"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-${{ matrix.package }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build and stage native artifacts
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo xtask stage-native-target ${{ matrix.package }} --release
      - name: Pack, install, load addon, and execute CLI smoke
        run: node scripts/binding-package-smoke.mjs packages/${{ matrix.package }}
      - name: Upload release-binding artifacts
        if: ${{ inputs.release_build }}
        uses: actions/upload-artifact@v7
        with:
          name: mastercss-${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/package.json
            packages/${{ matrix.package }}/mastercss.node
            packages/${{ matrix.package }}/mcss*
          if-no-files-found: error
          retention-days: 1

  native_musl:
    name: native-${{ matrix.package }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: binding-linux-arm64-musl
            runner: ubuntu-24.04-arm
          - package: binding-linux-x64-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build, pack, install, load, and execute CLI smoke in musl
        shell: bash
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm \
            -e TARGET_PACKAGE \
            -v "$PWD:/workspace" \
            -w /workspace \
            rust:1.98.1-alpine \
            sh -ec '
              apk add --no-cache build-base nodejs npm
              RUSTFLAGS="-C target-feature=-crt-static" \
                cargo xtask stage-native-target "$TARGET_PACKAGE" --release
              node scripts/binding-package-smoke.mjs "packages/$TARGET_PACKAGE"
            '
      - name: Upload release-binding artifacts
        if: ${{ inputs.release_build }}
        uses: actions/upload-artifact@v7
        with:
          name: mastercss-${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/package.json
            packages/${{ matrix.package }}/mastercss.node
            packages/${{ matrix.package }}/mcss*
          if-no-files-found: error
          retention-days: 1

  e2e_linux:
    name: e2e-linux
    needs: preflight
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: e2e
      - name: Install E2E browsers
        run: bun run playwright install --with-deps chromium firefox webkit
      - name: Build Rust Wasm artifacts
        run: bun run build:rust:wasm
      - name: Run E2E tests
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          args=(run e2e '--filter=./packages/*' --concurrency=1)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      - name: Retain E2E failure and retry diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            packages/*/test-results/
            packages/*/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      # Pull requests restore the cache but never write it, so one shared entry
      # per scope is refreshed by pushes instead of every run adding a new one.
      - name: Prune and save Turbo cache
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-e2e-${{ github.ref_name }}-${{ github.run_id }}

  compat_windows:
    name: compat-windows
    needs: preflight
    runs-on: windows-latest
    env:
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: compat
      - name: Install Chromium headless shell
        run: bun run playwright install --only-shell chromium
      - name: Build Rust Wasm artifacts
        run: bun run build:rust:wasm
      - name: Test packages
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          # Each Vitest suite can use half the runner's CPU. Keep two task
          # slots so concurrent cold builds do not starve bounded watch tests.
          args=(run test '--filter=./packages/*' --concurrency=2 --continue=dependencies-successful)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      - name: Build examples
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          args=(run build '--filter=./examples/*' --concurrency=4)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      # Pull requests restore the cache but never write it, so one shared entry
      # per scope is refreshed by pushes instead of every run adding a new one.
      - name: Prune and save Turbo cache
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-compat-${{ github.ref_name }}-${{ github.run_id }}

  compat_macos:
    name: compat-macos
    needs: preflight
    runs-on: macos-15
    env:
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base_sha }}
      TURBO_SCM_HEAD: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: compat
      - name: Install Chromium headless shell
        run: bun run playwright install --only-shell chromium
      - name: Build Rust Wasm artifacts
        run: bun run build:rust:wasm
      - name: Test packages
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          # Each Vitest suite can use half the runner's CPU. Keep two task
          # slots so concurrent cold builds do not starve bounded watch tests.
          args=(run test '--filter=./packages/*' --concurrency=2 --continue=dependencies-successful)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      - name: Build examples
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.preflight.outputs.full }}
        run: |
          set -euo pipefail
          args=(run build '--filter=./examples/*' --concurrency=4)
          if [ "$FULL_VALIDATION" != true ]; then
            args+=(--affected)
          fi
          bun run turbo "${args[@]}"
      # Pull requests restore the cache but never write it, so one shared entry
      # per scope is refreshed by pushes instead of every run adding a new one.
      - name: Prune and save Turbo cache
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-compat-${{ github.ref_name }}-${{ github.run_id }}
