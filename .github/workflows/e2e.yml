name: E2E
on:
    push:
        branches:
            - "**"
    pull_request_target:
        types:
            - opened
            - reopened
            - edited
            - synchronize

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                    version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                    node-version: 24
                    cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm exec playwright install --with-deps
            - run: pnpm run build
            - run: pnpm e2e
