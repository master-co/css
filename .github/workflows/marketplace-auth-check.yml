name: Marketplace authorization check
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-auth-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Marketplace credentials without publishing
    if: ${{ github.repository == 'master-co/css' && github.ref == 'refs/heads/rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Azure configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is required."
              exit 1
            fi
          done
      - uses: ./.github/actions/setup-bun
        with:
          ignore-scripts: "true"
          turbo-cache: "false"
      - name: Azure login for VSCE
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Marketplace publisher authorization
        run: bun run --filter @master/css-vscode vsce verify-pat --azure-credential masterco
