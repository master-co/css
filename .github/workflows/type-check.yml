name: Type Check
on:
    push:
        branches:
            - "**"
    pull_request_target:
        types:
            - opened
            - reopened
            - edited
            - synchronize

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm submodules
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
            - run: pnpm install
            - run: pnpm run build
            - run: pnpm run type-check
