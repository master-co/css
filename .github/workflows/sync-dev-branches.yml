name: Sync dev branches
on:
    push:
        branches:
            - "*"

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Techor Actions
              uses: techor-dev/techor@main
              with:
                  action: "sync-dev-branches"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
