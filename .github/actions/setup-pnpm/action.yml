name: Setup pnpm workspace
description: Configure pnpm and Node.js, fetch submodules, and install dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    default: "24"
  install:
    description: Whether to run pnpm install.
    default: "true"
  frozen-lockfile:
    description: Whether to install with --frozen-lockfile.
    default: "true"
  ignore-scripts:
    description: Whether to install with --ignore-scripts.
    default: "false"
  submodules:
    description: Whether to fetch repository submodules.
    default: "true"
  submodules-token:
    description: Token used by pnpm submodules to fetch private submodules.
    default: ""
  turbo-cache:
    description: Whether to restore and save the local Turbo cache.
    default: "true"
  turbo-cache-scope:
    description: Scope used to isolate Turbo caches by workload.
    default: "default"
runs:
  using: composite
  steps:
    # No version pin: the action reads packageManager from the root package.json,
    # so CI installs with the same pnpm that wrote the lockfile.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - if: ${{ inputs.turbo-cache == 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-cache-scope }}-${{ github.ref_name }}-
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-scope }}-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-scope }}-
    - if: ${{ inputs.submodules == 'true' }}
      shell: bash
      run: pnpm submodules
      env:
        GITHUB_TOKEN: ${{ inputs.submodules-token }}
    - if: ${{ inputs.install == 'true' && inputs.frozen-lockfile == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
    - if: ${{ inputs.install == 'true' && inputs.frozen-lockfile != 'true' }}
      shell: bash
      run: pnpm install --prefer-offline ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
